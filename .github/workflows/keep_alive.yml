name: Backend Keep Alive

on:
  schedule:
    - cron: '*/14 * * * *' # Run every 14 minutes
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          curl -I -s --max-time 60 --retry 2 https://vox-assist.onrender.com/health || echo "Keep-alive ping completed"
